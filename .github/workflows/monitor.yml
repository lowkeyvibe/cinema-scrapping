name: Monitor de cines

# Corre los monitores de novedades (Showcase IMAX y Cinemark) y avisa por Telegram.
# La "foto" de cada sitio se guarda en state/ con un commit.

on:
  schedule:
    # Cada 30 minutos (hora UTC). GitHub puede demorar unos minutos cada corrida.
    - cron: "*/30 * * * *"
    # Cada 6 horas, además, la tienda de merch de Cinemark (necesita un navegador: es más lenta).
    - cron: "7 */6 * * *"
  workflow_dispatch:      # botón "Run workflow" para correrlo a mano
    inputs:
      merch:
        description: "Revisar también el merch de Cinemark"
        type: boolean
        default: true

permissions:
  contents: write         # para guardar las fotos (state/) en el repo

concurrency:
  group: monitor-cines
  cancel-in-progress: false

env:
  MERCH: ${{ github.event.schedule == '7 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.merch) }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-monitor.txt

      - run: pip install -r requirements-monitor.txt

      - name: Instalar navegador (solo para el merch)
        if: env.MERCH == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps --only-shell chromium

      - name: Revisar novedades y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Bot propio de Cinemark (si no está, usa el general de arriba).
          TELEGRAM_BOT_TOKEN_CINEMARK: ${{ secrets.TELEGRAM_BOT_TOKEN_CINEMARK }}
          TELEGRAM_CHAT_ID_CINEMARK: ${{ secrets.TELEGRAM_CHAT_ID_CINEMARK }}
        run: python -m src.monitor ${{ env.MERCH == 'true' && '--merch' || '' }}

      - name: Guardar las fotos de los sitios
        # También si un monitor falló: el que anduvo ya mandó sus avisos y tiene que guardar su foto.
        if: success() || failure()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "monitor: actualizar estado"
            git pull --rebase --autostash
            git push
          fi
